spring.config.import=optional:file:.env[.properties]
spring.application.name=backend
spring.mvc.servlet.path=/api

#spring.mvc.throw-exception-if-no-handler-found=true

# Desabilita o mapeamento automático de recursos estáticos
spring.web.resources.add-mappings=false


#Logging
logging.level.org.springframework.security=DEBUG

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration,classpath:db/seed-dev
spring.flyway.baseline-on-migrate=true
spring.flyway.repair=true

# JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false 

#Perfis
spring.profiles.active=dev

# Banco de dados
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Logs Estruturados
#logging.structured.format.console=ecs

#Banner
spring.main.banner-mode=console

# CORS
app.cors.origins=http://localhost:5173,http://localhost:3000,http://localhost

# Error page padrão do Tomcat
spring.web.error.whitelabel.enabled=false
